<template>
  <div class="login">
    <div v-if="!isLogged">
      <div
        v-if="message"
        class="alert alert-danger alert-dismissible fade show"
        role="alert"
        >
        {{ message }}
        <button
          @click="message = ''"
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
          ></button>
      </div>
        <div class="form-floating mb-3">
          <input
          v-model="userEmail"
          class="form-control"
          id="email"
          type="mail"
          placeholder="your@email.com"
          />
          <label for="email">Correo Eléctronico</label>
        </div>
        <button type="button" @click="login" class="btn btn-primary mb-3">
          <svg class="me-2" width="18" height="18" fill="currentColor">
            <use xlink:href="#check-square" />
          </svg>
          Ingresar
        </button>
    </div>
    <div v-else>
      <p class="h3 my-3">Hola {{ user.firstName + " " + user.lastName }}</p>
      <button type="button" @click="logout" class="btn btn-primary mb-3">
        <svg class="me-2" width="18" height="18" fill="currentColor">
          <use xlink:href="#check-square" />
        </svg>
        Salir
      </button>
    </div>
  </div>
</template>
